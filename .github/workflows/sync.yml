name: Synchronizacja sprzątań

on:
  schedule:
    - cron: "17 * * * *"   # co godzinę o :17 UTC (= :17 w Warszawie, bo przesunięcie jest całogodzinne)
  workflow_dispatch:

concurrency:
  group: sync-cleanings
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Czy ta godzina jest w oknie synchronizacji?
        id: tz
        run: |
          HOUR=$(TZ=Europe/Warsaw date +%H)
          HM=$(TZ=Europe/Warsaw date +%H:%M)
          echo "Godzina w Warszawie: $HM"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$HOUR" in
              00|01|02|03|04|05|06|07) echo "Przerwa nocna, pomijam"; echo "run=false" >> "$GITHUB_OUTPUT" ;;
              *) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.tz.outputs.run == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalacja zależności
        if: steps.tz.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Synchronizacja
        if: steps.tz.outputs.run == 'true'
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          IDO_DOMAIN: ${{ secrets.IDO_DOMAIN }}
          IDO_LOGIN: ${{ secrets.IDO_LOGIN }}
          IDO_KEY: ${{ secrets.IDO_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python apicleaning.py
