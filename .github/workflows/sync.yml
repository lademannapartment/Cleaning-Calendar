name: Synchronizacja sprzątań

on:
  schedule:
    - cron: "30 6 * * *"    # 08:30 CEST (lato)
    - cron: "30 7 * * *"    # 08:30 CET (zima)
    - cron: "30 14 * * *"   # 16:30 CEST (lato)
    - cron: "30 15 * * *"   # 16:30 CET (zima)
    - cron: "59 21 * * *"   # 23:59 CEST (lato)
    - cron: "59 22 * * *"   # 23:59 CET (zima)
  workflow_dispatch:

concurrency:
  group: sync-cleanings
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Czy ten termin pasuje do Warszawy?
        id: tz
        run: |
          HM=$(TZ=Europe/Warsaw date +%H:%M)
          echo "Godzina w Warszawie: $HM"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$HM" in
              08:2[5-9]|08:3[0-5]|16:2[5-9]|16:3[0-5]|23:5[5-9]) echo "run=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.tz.outputs.run == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalacja zależności
        if: steps.tz.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Synchronizacja
        if: steps.tz.outputs.run == 'true'
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          IDO_DOMAIN: ${{ secrets.IDO_DOMAIN }}
          IDO_LOGIN: ${{ secrets.IDO_LOGIN }}
          IDO_KEY: ${{ secrets.IDO_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python apicleaning.py
